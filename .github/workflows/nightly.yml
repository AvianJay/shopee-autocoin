name: Nightly

# 每次 push 到 main、每天台灣時間 02:00、或手動觸發，都會重新建 APK，
# 然後「更新同一個」nightly release（不會每次多一包）。
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * *" # UTC 18:00 = 台灣 02:00
  workflow_dispatch:

# 同時間只跑一個，避免兩個 job 搶著改同一個 release
concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  android:
    name: Build signed release APK
    # 釘住 runner 版本：ubuntu-latest 在 2026-10-19 會換成 Ubuntu 26，
    # 夜間建置不該因為 image 換版而默默壞掉。
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # 不用 android-actions/setup-android：它會去裝已經被移除的 "tools" 套件而失敗。
      # GitHub 的 ubuntu runner 本來就裝好 Android SDK 了，直接用它的 sdkmanager。
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MGR="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n1 || true)"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdkmanager: ${MGR:-<找不到，交給 Gradle 自動下載>}"
          if [ -n "$MGR" ]; then
            yes | "$MGR" --licenses > /dev/null 2>&1 || true
            "$MGR" --install "platforms;android-36" "platform-tools" > /dev/null 2>&1 || true
          fi
          ls "$SDK/platforms" 2>/dev/null || true

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::repo secret KEYSTORE_BASE64 沒有設定（base64 後的 .jks 內容）"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ks/release.jks"
          test -s "$RUNNER_TEMP/ks/release.jks" || { echo "::error::keystore 解出來是空的"; exit 1; }
          echo "KEYSTORE_PATH=$RUNNER_TEMP/ks/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_ALIAS:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::repo secret KEYSTORE_ALIAS / KEYSTORE_PASSWORD 沒有設定"
            exit 1
          fi
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect artifact
        id: apk
        run: |
          set -euo pipefail
          src=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          [ -n "$src" ] || { echo "::error::找不到 APK"; exit 1; }
          # 固定檔名，這樣每次都會覆蓋掉上一個，release 裡只留最新的一份
          cp "$src" autocoin-nightly.apk
          sha256sum autocoin-nightly.apk | tee autocoin-nightly.apk.sha256
          echo "sha=$(cut -d' ' -f1 autocoin-nightly.apk.sha256)" >> "$GITHUB_OUTPUT"

      - name: Point nightly tag at this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          repo="${{ github.repository }}"
          sha="${{ github.sha }}"
          if gh api "repos/$repo/git/ref/tags/nightly" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$repo/git/refs/tags/nightly" -F sha="$sha" -F force=true > /dev/null
          else
            gh api -X POST "repos/$repo/git/refs" -f ref="refs/tags/nightly" -f sha="$sha" > /dev/null
          fi
          exit 0

      - name: Clear old nightly assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          if gh release view nightly > /dev/null 2>&1; then
            gh release view nightly --json assets --jq '.assets[].name' |
              while read -r a; do
                [ -n "$a" ] && gh release delete-asset nightly "$a" --yes > /dev/null 2>&1
              done
          fi
          exit 0

      - name: Update nightly release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly · build ${{ github.run_number }}
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Signed release APK（每次更新都覆蓋這個 release）。

            - build: `${{ github.run_number }}`
            - versionName: `0.1.${{ github.run_number }}`
            - commit: `${{ github.sha }}`
            - sha256: `${{ steps.apk.outputs.sha }}`
            - 觸發: `${{ github.event_name }}` by `${{ github.actor }}`
          files: |
            autocoin-nightly.apk
            autocoin-nightly.apk.sha256
